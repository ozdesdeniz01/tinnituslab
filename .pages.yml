media:
  - name: gorseller
    label: Görseller
    input: public/gorseller
    output: /gorseller
    categories: [image]
    rename: safe
  - name: belgeler
    label: Belgeler (PDF, Word vb.)
    input: public/belgeler
    output: /belgeler
    categories: [document, spreadsheet, compressed]
    rename: safe

content:
  - name: notlar
    label: Yazılarımız
    type: collection
    path: src/icerik/notlar
    filename:
      template: '{primary}.md'
      field: create
    view:
      fields: [baslik, tarih]
      primary: baslik
      sort: [tarih, baslik]
      default:
        sort: tarih
        order: desc
    fields:
      - name: baslik
        label: Başlık
        type: string
        required: true
      - name: ozet
        label: Özet
        description: Yazı listesinde ve sosyal medyada paylaşıldığında görünen bir iki cümlelik açıklama.
        type: text
        required: true
      - name: tarih
        label: Yayım tarihi
        type: date
        required: true
      - name: kapak
        label: Kapak görseli
        description: İsteğe bağlı. Yazının başında, yazı listesinde ve sosyal medya paylaşımlarında görünür. Yatay bir görsel seçin.
        type: image
        options:
          media: gorseller
          rename: safe
      - name: kapakAciklama
        label: Kapak görseli açıklaması
        description: Görselin altında görünür ve görme engelli okurlar için okunur.
        type: string
      - name: body
        label: İçerik
        description: Görsel eklemek için araç çubuğundaki görsel düğmesini kullanın.
        type: rich-text
        options:
          media: gorseller
          rename: safe
      - name: ekler
        label: Ekler (indirilebilir belgeler)
        description: İsteğe bağlı. PDF veya Word belgeleri yazının sonunda indirme bağlantısı olarak görünür.
        type: file
        options:
          media: belgeler
          rename: safe
          multiple:
            max: 5
      - name: taslak
        label: Taslak
        description: İşaretliyken yazı sitede görünmez. Yayımlamak için işareti kaldırın.
        type: boolean

  - name: bilgi
    label: Bilgi Merkezi
    type: collection
    path: src/icerik/bilgi
    filename:
      template: '{primary}.md'
      field: create
    view:
      fields: [baslik, sira]
      primary: baslik
      sort: [sira, baslik]
      default:
        sort: sira
        order: asc
    fields:
      - name: baslik
        label: Başlık
        type: string
        required: true
      - name: ozet
        label: Özet
        description: Kartlarda ve sosyal medya paylaşımlarında görünen bir iki cümlelik açıklama.
        type: text
        required: true
      - name: sira
        label: Sıra numarası
        description: Küçük numaralı yazı listede önce görünür.
        type: number
      - name: guncelleme
        label: Son güncelleme tarihi
        type: date
      - name: denetlendi
        label: Uzman tarafından denetlendi
        description: İşaretlenirse yazının altında "İçerik denetimi" satırında uzmanın adı görünür.
        type: boolean
      - name: body
        label: İçerik
        description: Görsel eklemek için araç çubuğundaki görsel düğmesini kullanın.
        type: rich-text
        options:
          media: gorseller
          rename: safe
      - name: kaynaklar
        label: Kaynaklar
        description: Her kaynağı ayrı satır olarak ekleyin.
        type: string
        list: true

  - name: yayinlar
    label: Akademik çalışmalar
    type: file
    path: src/data/yayinlar.json
    list: true
    fields:
      - { name: yil, label: Yıl, type: number }
      - { name: baslik, label: Başlık, type: string }
      - { name: yazarlar, label: Yazarlar, type: string }
      - { name: dergi, label: Dergi, type: string }
      - { name: ayrinti, label: 'Cilt, sayı, sayfa', type: string }
      - { name: baglanti, label: Bağlantı (DOI), type: string }

  - name: sss
    label: Sık sorulan sorular
    type: file
    path: src/data/sss.json
    list: true
    fields:
      - { name: soru, label: Soru, type: string }
      - { name: yanit, label: Yanıt, type: text }

  - name: sozluk
    label: Terimler sözlüğü
    type: file
    path: src/data/sozluk.json
    list: true
    fields:
      - { name: terim, label: Terim, type: string }
      - { name: tanim, label: Tanım, type: text }

  - name: ayarlar
    label: Site ayarları ve iletişim
    type: file
    path: src/data/site.json
    fields:
      - name: ad
        label: Site adı
        type: string
      - name: aciklama
        label: Site açıklaması
        description: Alt bilgide ve arama motoru sonuçlarında görünür.
        type: text
      - name: tema
        label: Renk teması
        type: select
        options:
          values: [mor, yesil]
      - name: uzman
        label: Uzman bilgileri
        type: object
        fields:
          - { name: ad, label: Ad soyad, type: string }
          - { name: unvan, label: Unvan, type: string }
          - name: foto
            label: Fotoğraf
            type: image
            options:
              media: gorseller
              rename: safe
          - { name: fotoAciklama, label: Fotoğraf açıklaması, type: string }
          - { name: kisaOzgecmis, label: Kısa özgeçmiş (ana sayfa), type: text }
          - { name: ozgecmis, label: Özgeçmiş (Hakkımızda), type: text }
          - { name: scholar, label: Google Akademik bağlantısı, type: string }
      - name: iletisim
        label: İletişim bilgileri
        type: object
        fields:
          - { name: telefon, label: Telefon, type: string }
          - { name: eposta, label: E-posta, type: string }
          - { name: adres, label: Adres, type: text }
          - { name: calismaSaatleri, label: Çalışma saatleri, type: string }
      - name: formAnahtari
        label: Form erişim anahtarı (Web3Forms)
        description: İletişim formunun çalışması için gereklidir. Boşken form sitede görünmez.
        type: string
      - name: sosyal
        label: Sosyal medya bağlantıları
        description: Doldurulan hesaplar sitenin alt bilgisinde görünür. Tam adresi yazın (https://...).
        type: object
        fields:
          - { name: instagram, label: Instagram, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
